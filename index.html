  ${fld('Descrição',`<input id="x-desc" placeholder="Ex.: retirada pessoal, aporte, troco">`,'wide')}${fld('Valor (R$)',`<input type="number" id="x-val" min="0" step="0.01">`)}</div>
  <p class="sub">Use para movimentos que não são vendas, compras, despesas ou investimentos. Retiradas para você mesma entram como saída.</p>
  <div class="mf"><span class="msg" id="mMsg"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" id="x-save">Salvar</button></div>`,true);
  $('#x-save').onclick=async()=>{const v=nval('x-val');if(!(v>0))return setMsg('Informe o valor.');if(!val('x-desc'))return setMsg('Escreva uma descrição.');$('#x-save').disabled=true;
    putEntry('caixa',{id:uid(),ts:Date.now(),data:val('x-data')||today(),tipo:val('x-tipo'),descricao:val('x-desc'),valor:r2(v)});await save('Lançamento salvo.')};
}

// ---------- sample data ----------
async function loadExample(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const t=today();const P=[
    ['P001','Sabão em pó','Sabão em pó','Limpex','800 g','Pacote',20,6,9.5,14.9,'Distribuidora Central'],
    ['P002','Sabão em pó','Sabão em pó','Limpex','1,6 kg','Pacote',12,4,17.8,26.9,'Distribuidora Central'],
    ['P003','Sabão líquido','Sabão líquido','Brisa','3 L','Frasco',10,4,21,32,'Atacado Bom Preço'],
    ['P004','Sabão líquido','Sabão líquido','Brisa','5 L','Galão',6,3,32,47.9,'Atacado Bom Preço'],
    ['P005','Amaciante','Amaciante','Fofura','2 L','Frasco',15,6,7.2,12.9,'Distribuidora Central'],
    ['P006','Amaciante','Amaciante','Fofura','5 L','Galão',5,3,19.5,22.9,'Atacado Bom Preço']];
  const pid={};P.forEach(r=>{const id='ex'+r[0];pid[r[0]]=id;putMaster('produtos',id,{codigo:r[0],nome:r[1],categoria:r[2],marca:r[3],tamanho:r[4],unidade:r[5],estoqueInicial:r[6],estoqueMinimo:r[7],custo:r[8],preco:r[9],fornecedor:r[10],exemplo:true,criadoEm:addDays(t,-60)})});
  const C=[['Maria Souza','(11) 98888-1111','Centro'],['João Pereira','(11) 97777-2222','Vila Nova'],['Ana Lima','(11) 96666-3333','Jardim América'],['Carla Mendes','(11) 95555-4444','Centro'],['Seu Antônio','(11) 94444-5555','Vila Nova']];
  const cid=C.map((c,i)=>{const id='exC'+i;putMaster('clientes',id,{nome:c[0],telefone:c[1],bairro:c[2],obs:i===4?'Prefere entrega aos sábados':'',exemplo:true,criadoEm:addDays(t,-60)});return id});
  const ev=[];
  ev.push({d:addDays(t,-58),f:()=>putEntry('investimentos',{id:uid(),ts:1,data:addDays(t,-58),tipo:'Estoque inicial',descricao:'Primeiro estoque de produtos',valor:1150,forma:'Pix',obs:'',exemplo:true})});
  ev.push({d:addDays(t,-56),f:()=>putEntry('investimentos',{id:uid(),ts:1,data:addDays(t,-56),tipo:'Prateleiras',descricao:'Prateleira de aço 5 níveis',valor:350,forma:'Cartão',obs:'',exemplo:true})});
  [[-40,'P001',12,9.3],[-33,'P005',12,7.1],[-20,'P003',6,20.5],[-12,'P002',6,17.9]].forEach(([dd,p,q,vu])=>ev.push({d:addDays(t,dd),f:()=>opCompra({data:addDays(t,dd),fornecedor:prod(pid[p]).fornecedor,produtoId:pid[p],qtd:q,valorUnit:vu,forma:'Pix',dataPagamento:addDays(t,dd),obs:'',exemplo:true})}));
  const D=[[-50,'Sacolas','Pacote com 500 sacolas',38,true],[-45,'Etiquetas','Etiquetas de preço',15,true],[-35,'Combustível','Entregas do mês',80,true],[-28,'Anúncios','Impulsionamento de post',30,true],[-15,'Combustível','Entregas',70,true],[-10,'Sacolas','Sacolas',25,true],[-6,'Telefone/internet','Plano do celular',59.9,false,-2]];
  D.forEach(([dd,cat,desc,v,pago,venc])=>ev.push({d:addDays(t,dd),f:()=>putEntry('despesas',{id:uid(),ts:1,data:addDays(t,dd),categoria:cat,descricao:desc,valor:v,forma:'Pix',pago,vencimento:venc?addDays(t,venc):'',dataPagamento:pago?addDays(t,dd):'',obs:'',exemplo:true})}));
  const codes=Object.keys(pid);
  for(let dd=-52;dd<=0;dd+=2){const n=rnd()<0.4?2:1;for(let k=0;k<n;k++){const d=addDays(t,dd);ev.push({d,f:()=>{
    const p=pid[codes[Math.floor(rnd()*codes.length)]];const q=1+Math.floor(rnd()*2);if(stock(p)<q)return;
    const c=rnd()<0.8?cid[Math.floor(rnd()*cid.length)]:'';const pr=+prod(p).preco;const tot=r2(q*pr);const fm=['Pix','Pix','Dinheiro','Cartão'][Math.floor(rnd()*4)];
    opVenda({data:d,clienteId:c,itens:[{produtoId:p,qtd:q,preco:pr}],desconto:0,forma:fm,prevista:'',obs:'',pagamentos:[{data:d,valor:tot,forma:fm}],exemplo:true})}})}}
  // fiado cases
  const fiado=(dd,ci,p,q,prevD,payD,obs)=>ev.push({d:addDays(t,dd),f:()=>{const pr=+prod(pid[p]).preco;const tot=r2(q*pr);if(stock(pid[p])<q)return;
    opVenda({data:addDays(t,dd),clienteId:cid[ci],itens:[{produtoId:pid[p],qtd:q,preco:pr}],desconto:0,forma:'Fiado',prevista:addDays(t,prevD),obs:obs||'',pagamentos:payD!==null?[{data:addDays(t,payD),valor:tot,forma:'Pix'}]:[],exemplo:true})}});
  fiado(-12,0,'P003',1,-5,null,'Combinou pagar no dia 5');
  fiado(-8,1,'P004',1,0,null,'');
  fiado(-4,2,'P005',2,2,null,'');
  fiado(-25,3,'P002',1,-18,-15,'');
  fiado(-3,0,'P001',1,5,null,'');
  ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).forEach(e=>e.f());
  const c=cfg();if(!c.saldoInicial)putMaster('config','geral',Object.assign({},M.config.get('geral')||{},{saldoInicial:500,dataSaldo:addDays(t,-60)}));
  await flush();render();toast('Dados de exemplo carregados.');
}
async function clearExample(){
  COLS_B.forEach(col=>all(col).filter(e=>e.exemplo).map(e=>e.id).forEach(id=>delEntry(col,id)));
  ['produtos','clientes'].forEach(col=>[...M[col].entries()].forEach(([id,d])=>{if(d.exemplo)delMaster(col,id)}));
  const c=M.config.get('geral');if(c&&c.saldoInicial===500){putMaster('config','geral',Object.assign({},c,{saldoInicial:0,dataSaldo:''}))}
  ver++;await flush();closeModal();render();toast('Dados de exemplo apagados.');
}

// ---------- events ----------
const ACT={
  go:id=>{view=id;try{history.replaceState(null,'','#'+id)}catch(e){}try{localStorage.setItem(LSK+'ui',JSON.stringify({view}))}catch(e){}render();window.scrollTo(0,0)},
  closeModal,novaVenda:()=>mVenda(),entrada:id=>mCompra(id),novoCli:()=>mCliente(),editCli:id=>mCliente(id),hist:id=>mHist(id),
  pagar:id=>mPagar(id),pagarCli:id=>mPagar(null,id),novaDesp:()=>mDespesa(),editDesp:id=>mDespesa(id),novoInv:()=>mInv(),editInv:id=>mInv(id),
  novoProd:()=>mProduto(),editProd:id=>mProduto(id),ajuste:id=>mAjuste(id),novoCaixa:()=>mCaixa(),
  clearF:k=>{const keep={vendas:{},compras:{},despesas:{}};F[k]=keep[k]||{};render()},
  sortA:k=>{F.analise.sort=k;render()},
  cxTipo:k=>{F.caixa.tipo=k;render()},cxHoje:()=>{F.caixa.ref=today();render()},
  cxNav:dir=>{const f=F.caixa,r=f.ref||today(),d=+dir;
    if(f.tipo==='dia')f.ref=addDays(r,d);else if(f.tipo==='semana')f.ref=addDays(r,7*d);
    else if(f.tipo==='mes'){const m=d>0?nextM(r.slice(0,7)):prevM(r.slice(0,7));f.ref=m+'-01'}else f.ref=(+r.slice(0,4)+d)+'-01-01';render()},
  cancVenda:id=>{const s=getEntry('vendas',id);confirmBox('Cancelar venda #'+s.numero,`A venda de <b>${brl(s.total)}</b> para <b>${esc(cName(s))}</b> será marcada como cancelada e os produtos voltam para o estoque (registrado como Devolução). ${paidOf(s)>0?`Os ${brl(paidOf(s))} já recebidos deixam de contar no caixa; se devolveu o dinheiro, está certo assim.`:''}`,'Cancelar venda',async()=>{
    const x=JSON.parse(JSON.stringify(s));x.cancelada=true;x.canceladaEm=today();putEntry('vendas',x);s.itens.forEach(i=>addMov({data:today(),produtoId:i.produtoId,tipo:'Devolução',qtd:i.qtd,motivo:'Cancelamento da venda #'+s.numero,ref:s.id,exemplo:s.exemplo||undefined}));await save('Venda #'+s.numero+' cancelada.')},true)},
  cancCompra:id=>{const c=getEntry('compras',id);if(stock(c.produtoId)<c.qtd){toast('Não dá para estornar: parte desse estoque já foi vendida. Use um ajuste.');return}
    confirmBox('Estornar entrada',`A entrada de <b>${num(c.qtd)} ${esc(pName(prod(c.produtoId)))}</b> (${brl(c.total)}) será estornada: o estoque diminui e o valor deixa de contar como gasto. O registro continua no histórico.`,'Estornar',async()=>{
    const x=JSON.parse(JSON.stringify(c));x.cancelada=true;putEntry('compras',x);addMov({data:today(),produtoId:c.produtoId,tipo:'Ajuste',qtd:-c.qtd,motivo:'Estorno da compra de '+fd(c.data),ref:c.id,exemplo:c.exemplo||undefined});await save('Entrada estornada.')},true)},
  pagarDesp:async id=>{const d=JSON.parse(JSON.stringify(getEntry('despesas',id)));d.pago=true;d.dataPagamento=today();putEntry('despesas',d);await flush();render();toast('Despesa marcada como paga.')},
  delDesp:id=>{const d=getEntry('despesas',id);confirmBox('Excluir despesa',`Excluir <b>${esc(d.categoria)}</b> de ${brl(d.valor)}?`,'Excluir',async()=>{delEntry('despesas',id);await save('Despesa excluída.')},true)},
  delInv:id=>{const d=getEntry('investimentos',id);confirmBox('Excluir investimento',`Excluir <b>${esc(d.tipo)}</b> de ${brl(d.valor)}?`,'Excluir',async()=>{delEntry('investimentos',id);await save('Investimento excluído.')},true)},
  delCaixa:id=>{const d=getEntry('caixa',id);confirmBox('Excluir lançamento',`Excluir <b>${esc(d.descricao)}</b> de ${brl(d.valor)}?`,'Excluir',async()=>{delEntry('caixa',id);await save('Lançamento excluído.')},true)},
  backup:()=>{const data={app:'loja-limpeza',versao:1,geradoEm:new Date().toISOString()};[...COLS_B,...COLS_M].forEach(c=>{data[c]=Object.fromEntries(COLS_B.includes(c)?B[c]:M[c])});
    const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='backup-loja-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup baixado.')},
  saveCfg:async()=>{putMaster('config','geral',Object.assign({},M.config.get('geral')||{},{nome:val('c-nome')||'Minha Loja',saldoInicial:r2(nval('c-saldo')),dataSaldo:val('c-dsaldo'),diasAviso:Math.max(0,Math.round(nval('c-dias'))),margemMin:Math.max(0,nval('c-margem')),quedaFat:Math.max(1,nval('c-queda'))}));await flush();render();toast('Ajustes salvos.')},
  gsConnect:()=>gsConnect(),gsSync:()=>gsSync(false),
  gsUpload:()=>confirmBox('Reenviar tudo','Todos os dados deste aparelho serão gravados de novo na planilha, <b>substituindo</b> o que estiver lá. Use se a planilha ficou diferente do app.','Reenviar tudo',async()=>{touched.clear();gsQueue=fullOps();saveQueue();closeModal();await gsSend();render();toast(gsState.erro||'Dados reenviados para a planilha.')},true),
  gsOff:()=>confirmBox('Desconectar a planilha','O app deixa de gravar na planilha. Os dados continuam na planilha e também neste navegador.','Desconectar',()=>{gs=null;gsQueue=[];saveGs();saveQueue();closeModal();render();toast('Planilha desconectada.')},true),
  loadEx:()=>{if(all('produtos').some(p=>p.exemplo))return toast('Os dados de exemplo já estão carregados.');loadExample()},
  clearEx:()=>confirmBox('Apagar dados de exemplo','Todos os produtos, clientes, vendas, entradas, despesas e investimentos de exemplo serão apagados. O que você cadastrou de verdade continua.','Apagar exemplos',clearExample,true),
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(e.target.id==='ov')return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id)}});
document.addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov'))closeModal()});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;const [k,n]=f.split('.');F[k][n]=e.target.value;if(e.target.tagName==='SELECT'||e.target.type==='date')render();else schedule()});
document.addEventListener('change',async e=>{const pid=e.target.dataset&&e.target.dataset.min;if(!pid)return;const v=Math.max(0,Math.round(parseFloat(e.target.value)||0));const d=Object.assign({},M.produtos.get(pid),{estoqueMinimo:v});putMaster('produtos',pid,d);await flush();render();toast('Estoque mínimo atualizado.')});
document.addEventListener('change',e=>{if(e.target.id!=='restore'||!e.target.files[0])return;const file=e.target.files[0];e.target.value='';const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(x){return toast('Arquivo inválido: não é um backup deste sistema.')}
    if(!d||d.app!=='loja-limpeza')return toast('Arquivo inválido: não é um backup deste sistema.');
    confirmBox('Restaurar backup','Os dados atuais deste navegador serão <b>substituídos</b> pelos do backup de '+esc(fd((d.geradoEm||'').slice(0,10)))+'. Se tiver dúvida, baixe um backup dos dados atuais antes.','Restaurar',async()=>{
      [...COLS_B,...COLS_M].forEach(c=>{const t=COLS_B.includes(c)?B:M;t[c]=new Map(Object.entries(d[c]||{}));dirty.add(c+'/_')});ver++;touched.clear();if(gs){gsQueue=fullOps();saveQueue()}await flush();closeModal();render();toast('Backup restaurado.')},true)};
  rd.readAsText(file)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==view){view=h;render()}});

boot();
})();
</script>
