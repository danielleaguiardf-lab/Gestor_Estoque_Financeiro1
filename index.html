<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sistema de gestão para pequena loja de produtos de limpeza: estoque, vendas, fiado, clientes, despesas, investimentos, fluxo de caixa e lucro.">
<title>Gestão da Loja de Limpeza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Gestão da Loja de Limpeza — style.css */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E8EEEC; --ink:#12302B; --muted:#5B706B; --line:#D5DFDC;
  --accent:#0B6E69; --accent-ink:#FFFFFF; --accent-soft:#D4ECE9; --lilac:#6B5CA5; --lilac-soft:#E7E3F4;
  --ok:#1F7F46; --ok-soft:#DDF3E4; --warn:#9A6512; --warn-soft:#FBF0D9; --orange:#B84C14; --orange-soft:#FCE5D8;
  --bad:#B82E25; --bad-soft:#F9DEDB; --shadow:0 1px 2px rgba(18,48,43,.06),0 6px 24px rgba(18,48,43,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1917; --surface:#15221F; --surface2:#1C2C28; --ink:#E4EEEB; --muted:#93A8A3; --line:#2A3C38;
    --accent:#3FB8AE; --accent-ink:#06201D; --accent-soft:#16403C; --lilac:#A99BE0; --lilac-soft:#2B2645;
    --ok:#4CC27E; --ok-soft:#173826; --warn:#E3B04B; --warn-soft:#3A2E14; --orange:#EE8A52; --orange-soft:#3D2416;
    --bad:#F0736A; --bad-soft:#43201D; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1917; --surface:#15221F; --surface2:#1C2C28; --ink:#E4EEEB; --muted:#93A8A3; --line:#2A3C38;
  --accent:#3FB8AE; --accent-ink:#06201D; --accent-soft:#16403C; --lilac:#A99BE0; --lilac-soft:#2B2645;
  --ok:#4CC27E; --ok-soft:#173826; --warn:#E3B04B; --warn-soft:#3A2E14; --orange:#EE8A52; --orange-soft:#3D2416;
  --bad:#F0736A; --bad-soft:#43201D; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:17px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:12px}
.navg{margin-top:14px}
.navg>span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:500}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .bdg{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
main{padding-block:22px 60px;padding-inline:28px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.qa:hover{border-color:var(--accent);color:var(--accent)}
.qa.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qa.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.hd p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.sec{margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)} .kpi.bad .v{color:var(--bad)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .kpi.hero .l,.kpi.hero .s{color:var(--accent-ink);opacity:.85}
.up{color:var(--ok);font-weight:600} .down{color:var(--bad);font-weight:600} .flat{color:var(--muted)}
.kpi.hero .up,.kpi.hero .down,.kpi.hero .flat{color:var(--accent-ink)}
[hidden]{display:none!important}
.q b{white-space:normal}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px;padding:12px;background:var(--surface2);border-radius:12px}
.fi{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fi input,.fi select{min-width:120px;max-width:220px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2);position:sticky;top:0}
th.sort{cursor:pointer} th.sort:hover{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tr.late td{background:var(--bad-soft)}
tr.today td{background:var(--orange-soft)}
tr.canc td{opacity:.5;text-decoration:line-through}
tr.canc td:last-child{text-decoration:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-orange{background:var(--orange-soft);color:var(--orange)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-mute{background:var(--surface2);color:var(--muted)} .c-lilac{background:var(--lilac-soft);color:var(--lilac)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;background:var(--lilac-soft);color:var(--lilac)}
.sub{color:var(--muted);font-size:12.5px}
.sumrow{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:12px;font-size:14px}
.sumrow b{font-variant-numeric:tabular-nums}
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.al .ic{font-size:16px;line-height:1.3}
.al.red{border-color:var(--bad);background:var(--bad-soft)} .al.orange{border-color:var(--orange);background:var(--orange-soft)}
.al.yellow{border-color:var(--warn);background:var(--warn-soft)} .al.green{border-color:var(--ok);background:var(--ok-soft)}
.al .t{flex:1}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0 24px}
.q{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.q span{color:var(--muted)} .q b{text-align:right;font-variant-numeric:tabular-nums}
.dre{width:100%;font-size:14.5px}
.dre td{padding:9px 4px}
.dre tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.dre td.exp{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:stretch}
.flowop{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list li b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px;max-width:80ch}
.banner{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:var(--lilac-soft);border:1px solid var(--lilac);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.banner p{margin:0;max-width:70ch}
.minin{width:70px;padding:3px 6px;text-align:right}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,25,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:50}
.md{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:720px;padding:20px}
.md.sm{max-width:440px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.mh h2{margin:0}
.x{border:0;background:var(--surface2);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.fld small{font-weight:400;color:var(--muted)}
.fld.wide{grid-column:1/-1}
.mf{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px}
.mf .msg{flex:1 1 220px;font-size:13px;color:var(--bad);font-weight:600}
.mf .msg.warn{color:var(--warn)}
.items{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.item{display:grid;grid-template-columns:minmax(0,3fr) 80px 110px 100px 34px;gap:8px;align-items:center}
.item .st{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.summ{display:flex;flex-wrap:wrap;gap:6px 20px;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.summ b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.saving{font-size:12px;color:var(--muted);padding:12px 10px 0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 0 8px}
  .navwrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .navg{display:contents}.navg>span{display:none}
  .nav{width:auto;white-space:nowrap;gap:6px;flex:none}
  .saving{display:none}
  main{padding-inline:16px}
  .cols2{grid-template-columns:1fr}
  h1{font-size:25px}
  .item{grid-template-columns:1fr 70px 90px;}
  .item .st{grid-column:1/3;text-align:left}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v3l2 3v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-3z"/><path d="M7 13h10"/></svg></div>
      <div><b id="storeName">Minha Loja</b><small>Produtos de limpeza</small></div>
    </div>
    <nav class="navwrap" id="nav"></nav>
    <div class="saving" id="saveState"></div>
  </aside>
  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<div id="modalRoot"></div>

<script>
/*
 * Gestão da Loja de Limpeza — app.js
 * Toda a lógica do sistema: dados, cálculos (estoque, vendas, fiado, caixa, lucro),
 * alertas, telas e formulários. JavaScript puro, sem dependências.
 * Os dados ficam no localStorage do navegador (backup em Ajustes).
 */
(function(){
'use strict';
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>fmtBRL.format(Math.abs(n)<0.005?0:(n||0));
const num=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(n||0);
const pct=n=>isFinite(n)?new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n)+'%':'—';
const r2=n=>Math.round((+n||0)*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const fdShort=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'—';
const curM=()=>today().slice(0,7);
const prevM=m=>{let y=+m.slice(0,4),mo=+m.slice(5,7)-1;if(mo===0){mo=12;y--}return y+'-'+pad(mo)};
const nextM=m=>{let y=+m.slice(0,4),mo=+m.slice(5,7)+1;if(mo===13){mo=1;y++}return y+'-'+pad(mo)};
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mLabel=m=>MES[+m.slice(5,7)-1]+' de '+m.slice(0,4);
const mShort=m=>MES[+m.slice(5,7)-1].slice(0,3)+'/'+m.slice(2,4);
const lastDay=m=>{const d=new Date(+m.slice(0,4),+m.slice(5,7),0);return iso(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const digits=s=>String(s||'').replace(/\D/g,'');

const FORMAS=['Dinheiro','Pix','Cartão','Transferência','Fiado','Outro'];
const FORMAS_PG=['Dinheiro','Pix','Cartão','Transferência','Outro'];
const CAT_DESP=['Compra de mercadorias','Embalagens','Sacolas','Etiquetas','Transporte','Combustível','Entrega','Divulgação','Marketing','Anúncios','Taxas','Equipamentos','Manutenção','Telefone/internet','Outros'];
const TIPOS_INV=['Freezer/equipamento','Prateleiras','Estoque inicial','Máquina','Celular','Computador','Material para divulgação','Reforma','Embalagens em grande quantidade','Outros investimentos'];
const CAT_PROD=['Sabão em pó','Sabão líquido','Amaciante','Desinfetante','Detergente','Água sanitária','Outros'];
const UNIDADES=['Unidade','Pacote','Frasco','Galão','Caixa','Fardo'];
const MOV_TIPOS=['Compra','Venda','Ajuste','Perda','Devolução','Outros'];

// ---------- storage ----------
// Movement-type collections are kept in one document per month ("bucket") so the store stays small.
const COLS_B=['vendas','compras','despesas','investimentos','movimentos','caixa'];
const COLS_M=['produtos','clientes','config'];
const B={};COLS_B.forEach(c=>B[c]=new Map());
const M={};COLS_M.forEach(c=>M[c]=new Map());
const dirty=new Set();
let db=null,mode='loading',ver=0;const memo={};
const LSK='lojaLimpeza.v1.';

function all(col){
  const k=col;if(memo[k]&&memo[k].ver===ver)return memo[k].arr;
  let arr;
  if(COLS_B.includes(col)){arr=[];B[col].forEach(doc=>{Object.values(doc.v||{}).forEach(e=>arr.push(e))})}
  else{arr=[];M[col].forEach((d,id)=>arr.push(Object.assign({id},d)))}
  memo[k]={ver,arr};return arr;
}
function cfg(){return Object.assign({nome:'Minha Loja',saldoInicial:0,dataSaldo:'',diasAviso:3,margemMin:20,quedaFat:30},M.config.get('geral')||{})}
function findBucket(col,id){for(const [b,doc] of B[col]){if(doc.v&&doc.v[id])return b}return null}
function getEntry(col,id){const b=findBucket(col,id);return b?B[col].get(b).v[id]:null}
function putEntry(col,e){
  e=JSON.parse(JSON.stringify(e));
  const b=e.data.slice(0,7);const old=findBucket(col,e.id);
  if(old&&old!==b){const d=B[col].get(old);delete d.v[e.id];dirty.add(col+'/'+old)}
  if(!B[col].has(b))B[col].set(b,{v:{}});
  B[col].get(b).v[e.id]=e;dirty.add(col+'/'+b);touched.add(col+'|'+e.id);ver++;
}
function delEntry(col,id){const b=findBucket(col,id);if(!b)return;delete B[col].get(b).v[id];dirty.add(col+'/'+b);touched.add(col+'|'+id);ver++}
function putMaster(col,id,data){const d=JSON.parse(JSON.stringify(data));delete d.id;M[col].set(id,d);dirty.add(col+'/'+id);touched.add(col+'|'+id);ver++}
function delMaster(col,id){M[col].delete(id);dirty.add(col+'/'+id);touched.add(col+'|'+id);ver++}

let saving=0;
async function flush(){
  gsQueueTouched();if(gs)gsSend();
  if(!dirty.size)return true;
  const jobs=[...dirty].map(k=>{const [col,id]=k.split('/');const isB=COLS_B.includes(col);
    let data=isB?B[col].get(id):M[col].get(id);
    if(isB&&data&&!Object.keys(data.v||{}).length)data=null;
    return {k,col,id,data:data?JSON.parse(JSON.stringify(data)):null}});
  dirty.clear();saving++;setSaveState();
  let ok=true;
  try{
    if(mode==='cloud'){
      for(const j of jobs){
        const ref=db.doc(j.col+'/'+j.id);
        try{ j.data?await ref.set(j.data):await ref.delete(); }

      }
    }else{
      const cols=new Set(jobs.map(j=>j.col));
      cols.forEach(col=>{try{const src=COLS_B.includes(col)?B[col]:M[col];localStorage.setItem(LSK+col,JSON.stringify(Object.fromEntries(src)))}catch(e){}});

function opsFor(key){
  const [col,id]=key.split('|');
  if(col==='config')return cfgRows().map(r=>({op:'upsert',tab:'Config',id:r.chave,row:r}));
  if(COLS_M.includes(col)){const d=M[col].get(id);return[d?{op:'upsert',tab:TAB[col],id,row:toRow(col,Object.assign({id},d))}:{op:'delete',tab:TAB[col],id}]}
  const e=getEntry(col,id);
  const main=e?{op:'upsert',tab:TAB[col],id,row:toRow(col,e)}:{op:'delete',tab:TAB[col],id};
  if(col!=='vendas')return[main];
  return[main,{op:'replaceWhere',tab:'Itens_Venda',col:'venda_id',val:id,rows:e?itemRows(e):[]},{op:'replaceWhere',tab:'Pagamentos',col:'venda_id',val:id,rows:e?payRows(e):[]}];
}
function fullOps(){
  const ops=[];
  COLS_M.filter(c=>c!=='config').forEach(c=>ops.push({op:'replaceAll',tab:TAB[c],rows:all(c).map(e=>toRow(c,e))}));
  COLS_B.forEach(c=>ops.push({op:'replaceAll',tab:TAB[c],rows:all(c).map(e=>toRow(c,e))}));
  ops.push({op:'replaceAll',tab:'Itens_Venda',rows:[].concat(...all('vendas').map(itemRows))});
  ops.push({op:'replaceAll',tab:'Pagamentos',rows:[].concat(...all('vendas').map(payRows))});

async function gsPost(body){

  let j;try{j=await res.json()}catch(e){throw new Error('A planilha não respondeu direito. Confira o endereço do app da planilha.')}
  if(!j.ok)throw new Error(j.erro||'Erro na planilha.');return j;
}
async function gsGet(){
  const res=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'chave='+encodeURIComponent(gs.chave)+'&t='+Date.now());
  let j;try{j=await res.json()}catch(e){throw new Error('A planilha não respondeu direito. Confira o endereço do app da planilha.')}
  if(!j.ok)throw new Error(j.erro||'Erro na planilha.');if(j.versao)gsState.versao=j.versao;if(j.planilha&&gs.planilha!==j.planilha){gs.planilha=j.planilha;saveGs()}return j.dados||{};

}

async function gsCheck(){
  if(!gs||gsState.pulling||gsState.sending||document.visibilityState!=='visible')return;
  if(gsQueue.length){gsSend();return}
  try{const res=await fetch(gs.url+(gs.url.includes('?')?'&':'?')+'modo=versao&chave='+encodeURIComponent(gs.chave)+'&t='+Date.now());const j=await res.json();
    if(!j.ok)throw new Error(j.erro||'Erro na planilha.');
    if(gsState.erro){gsState.erro='';setSaveState()}
    if(j.versao!==gsState.versao){if($('#ov')){gsState.aguardando=true;return}gsSync(true)}}

  if(dbx){

    [...COLS_B,...COLS_M].forEach(col=>{
      db.collection(col).limit(1000).onSnapshot(snap=>{

        const map=new Map();snap.docs.forEach(d=>{if(d.exists)map.set(d.id,JSON.parse(JSON.stringify(d.data())))});

const prods=()=>all('produtos').slice().sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||'',undefined,{numeric:true}));
const clis=()=>all('clientes').slice().sort((a,b)=>a.nome.localeCompare(b.nome));
const pName=p=>p?[p.nome,p.tamanho].filter(Boolean).join(' '):'(produto removido)';
const cName=s=>s.clienteId?(cli(s.clienteId)?.nome||'(cliente removido)'):(s.clienteNome||'Venda avulsa');

function stockInfo(){
  const k='stock';if(memo[k]&&memo[k].ver===ver)return memo[k].v;
  const v={};all('produtos').forEach(p=>v[p.id]={ent:0,sai:0,atual:+p.estoqueInicial||0});
  all('movimentos').forEach(m=>{const s=v[m.produtoId];if(!s)return;if(m.qtd>0)s.ent+=m.qtd;else s.sai+=-m.qtd;s.atual+=m.qtd});
  memo[k]={ver,v};return v;
}
const stock=id=>(stockInfo()[id]||{atual:0}).atual;
function stockStatus(p){const a=stock(p.id),mn=+p.estoqueMinimo||0;
  if(a<=0)return{k:'esg',label:'Esgotado',cls:'c-bad',ic:'🔴'};
  if(mn>0&&a<=mn/2)return{k:'crit',label:'Crítico',cls:'c-bad',ic:'🔴'};
  if(a<=mn)return{k:'baixo',label:'Baixo',cls:'c-warn',ic:'🟡'};
  return{k:'ok',label:'Normal',cls:'c-ok',ic:'🟢'}}
const margemR=p=>r2((+p.preco||0)-(+p.custo||0));
const margemP=p=>(+p.preco)>0?((+p.preco-(+p.custo||0))/(+p.preco))*100:0;
function lastPurchase(pid){let d='';all('compras').forEach(c=>{if(c.produtoId===pid&&!c.cancelada&&c.data>d)d=c.data});return d}

const salesAll=()=>all('vendas');
const sales=()=>salesAll().filter(s=>!s.cancelada);
const paidOf=s=>r2(sum(s.pagamentos||[],p=>p.valor));
const openOf=s=>s.cancelada?0:Math.max(0,r2(s.total-paidOf(s)));
const lastPayDate=s=>(s.pagamentos||[]).reduce((d,p)=>p.data>d?p.data:d,'');
function stat(s){
  const t=today(),c=cfg();
  if(s.cancelada)return{k:'canc',label:'Cancelada',cls:'c-mute'};
  if(openOf(s)<=0.005){const lp=lastPayDate(s);
    if(s.prevista&&lp>s.prevista)return{k:'atrasopago',label:'Pago com atraso',cls:'c-lilac'};
    return{k:'pago',label:'Pago',cls:'c-ok'}}
  if(s.prevista&&s.prevista<t)return{k:'venc',label:'Vencido',cls:'c-bad',dias:diffDays(s.prevista,t)};
  if(s.prevista===t)return{k:'hoje',label:'Vence hoje',cls:'c-orange'};
  if(s.prevista&&diffDays(t,s.prevista)<=c.diasAviso)return{k:'prox',label:'Vence em '+diffDays(t,s.prevista)+' d',cls:'c-warn',dias:diffDays(t,s.prevista)};
  return{k:'pend',label:'Pendente',cls:'c-warn'};
}
const isOpenKind=k=>['venc','hoje','prox','pend'].includes(k);
const despStatus=d=>{if(d.pago)return{k:'pago',label:'Pago',cls:'c-ok'};const t=today();
  if(d.vencimento&&d.vencimento<t)return{k:'venc',label:'Vencida',cls:'c-bad'};
  if(d.vencimento===t)return{k:'hoje',label:'Vence hoje',cls:'c-orange'};return{k:'pend',label:'Pendente',cls:'c-warn'}};
const isMerc=d=>d.categoria==='Compra de mercadorias';

function itemsNet(s){const sub=sum(s.itens,i=>i.qtd*i.preco);return s.itens.map(i=>{const b=i.qtd*i.preco;const net=sub>0?b-(+s.desconto||0)*(b/sub):b;return{...i,fat:net,custoT:i.qtd*i.custo}})}

function fin(m){
  const vs=sales().filter(s=>s.data.startsWith(m));
  const fat=r2(sum(vs,s=>s.total)),cmv=r2(sum(vs,s=>s.custoTotal));
  const recebido=r2(sum(sales(),s=>sum((s.pagamentos||[]).filter(p=>p.data.startsWith(m)),p=>p.valor)));
  const pend=r2(sum(vs,openOf));
  const ds=all('despesas').filter(d=>d.data.startsWith(m));
  const desp=r2(sum(ds.filter(d=>!isMerc(d)),d=>d.valor));
  const compras=r2(sum(all('compras').filter(c=>!c.cancelada&&c.data.startsWith(m)),c=>c.total)+sum(ds.filter(isMerc),d=>d.valor));
  const perdas=r2(sum(all('movimentos').filter(x=>x.tipo==='Perda'&&x.data.startsWith(m)),x=>-x.qtd*(x.custoUnit||0)));
  const inv=r2(sum(all('investimentos').filter(i=>i.data.startsWith(m)),i=>i.valor));
  const lb=r2(fat-cmv),lo=r2(lb-desp),ll=r2(lo-perdas);
  const qtdItens=sum(vs,s=>sum(s.itens,i=>i.qtd));
  return{m,n:vs.length,fat,cmv,lb,desp,lo,perdas,ll,inv,recebido,pend,compras,qtdItens,ticket:vs.length?fat/vs.length:0,margem:fat?lb/fat*100:0,margemL:fat?ll/fat*100:0,vendas:vs};
}
function prodStats(a,b){ // a..b inclusive (strings) or null for all
  const r={};all('produtos').forEach(p=>r[p.id]={id:p.id,q:0,fat:0,custo:0});
  sales().forEach(s=>{if(a&&s.data<a)return;if(b&&s.data>b)return;itemsNet(s).forEach(i=>{const x=r[i.produtoId]||(r[i.produtoId]={id:i.produtoId,q:0,fat:0,custo:0});x.q+=i.qtd;x.fat+=i.fat;x.custo+=i.custoT})});
  Object.values(r).forEach(x=>{x.lucro=x.fat-x.custo;x.margem=x.fat?x.lucro/x.fat*100:null});return r;
}
function cliStats(){
  const k='cli';if(memo[k]&&memo[k].ver===ver)return memo[k].v;
  const r={};all('clientes').forEach(c=>r[c.id]={n:0,total:0,pago:0,pend:0,atraso:0,first:'',last:'',maxDias:0,prox:''});
  sales().forEach(s=>{if(!s.clienteId)return;const x=r[s.clienteId];if(!x)return;x.n++;x.total+=s.total;x.pago+=Math.min(s.total,paidOf(s));const o=openOf(s);x.pend+=o;
    if(!x.first||s.data<x.first)x.first=s.data;if(s.data>x.last)x.last=s.data;const st=stat(s);
    if(st.k==='venc'){x.atraso+=o;x.maxDias=Math.max(x.maxDias,st.dias)}
    if(o>0&&s.prevista&&(!x.prox||s.prevista<x.prox))x.prox=s.prevista});
  memo[k]={ver,v:r};return r;
}
function cashEvents(){
  const k='cash';if(memo[k]&&memo[k].ver===ver)return memo[k].v;
  const ev=[];
  sales().forEach(s=>(s.pagamentos||[]).forEach(p=>ev.push({data:p.data,valor:+p.valor,grupo:p.data<=s.data?'Vendas pagas':'Recebimentos de vendas anteriores',desc:'Venda #'+s.numero+' · '+cName(s),forma:p.forma})));
  all('caixa').forEach(c=>ev.push({data:c.data,valor:c.tipo==='entrada'?+c.valor:-c.valor,grupo:c.tipo==='entrada'?'Outras entradas':'Outros pagamentos / retiradas',desc:c.descricao,id:c.id,caixa:true}));
  all('compras').forEach(c=>{if(!c.cancelada)ev.push({data:c.dataPagamento||c.data,valor:-c.total,grupo:'Compras de mercadorias',desc:pName(prod(c.produtoId))+' · '+c.qtd+' un. · '+(c.fornecedor||''),forma:c.forma})});
  all('despesas').forEach(d=>{if(d.pago)ev.push({data:d.dataPagamento||d.vencimento||d.data,valor:-d.valor,grupo:isMerc(d)?'Compras de mercadorias':'Despesas',desc:d.categoria+' · '+(d.descricao||''),forma:d.forma})});
  all('investimentos').forEach(i=>ev.push({data:i.data,valor:-i.valor,grupo:'Investimentos',desc:i.tipo+' · '+(i.descricao||''),forma:i.forma}));
  memo[k]={ver,v:ev};return ev;
}
function flow(a,b){
  const ev=cashEvents(),c=cfg();
  const ini=r2((+c.saldoInicial||0)+sum(ev.filter(e=>e.data<a),e=>e.valor));
  const inP=ev.filter(e=>e.data>=a&&e.data<=b).sort((x,y)=>x.data<y.data?-1:1);
  const g={};inP.forEach(e=>g[e.grupo]=(g[e.grupo]||0)+e.valor);
  const ent=r2(sum(inP.filter(e=>e.valor>0),e=>e.valor)),sai=r2(-sum(inP.filter(e=>e.valor<0),e=>e.valor));
  return{ini,ent,sai,fim:r2(ini+ent-sai),g,list:inP};
}
const cashNow=()=>flow(today(),today()).fim;

function reposicao(){
  const t=today(),a30=addDays(t,-29),a90=addDays(t,-89);
  const s30=prodStats(a30,t),s90=prodStats(a90,t);
  return prods().map(p=>{const at=stock(p.id),mn=+p.estoqueMinimo||0,v30=s30[p.id]?.q||0,med=(s90[p.id]?.q||0)/3,dia=med/30;
    let sug=Math.max(0,Math.ceil(med+mn-at));if(med===0&&at<=mn)sug=Math.max(0,mn*2-at);
    const cob=dia>0?Math.floor(Math.max(0,at)/dia):null;
    return{p,at,mn,v30,med,cob,fim:cob!==null?addDays(t,cob):'',sug,custoSug:sug*(+p.custo||0)}});
}
function retirada(m){
  const caixa=cashNow();const ms=[prevM(m),prevM(prevM(m)),prevM(prevM(prevM(m)))];
  const medDesp=sum(ms,x=>fin(x).desp)/3;const repo=sum(reposicao(),r=>r.custoSug);
  const reserva=r2(medDesp+repo);const ll=fin(m).ll;
  const pode=Math.max(0,Math.min(caixa-reserva,Math.max(0,ll)));
  return{caixa,medDesp,repo,reserva,ll,pode:r2(pode)};
}

function alerts(){
  const out=[],t=today(),c=cfg();
  const opens=sales().filter(s=>openOf(s)>0);
  opens.forEach(s=>{const st=stat(s),n=cName(s),v=brl(openOf(s));
    if(st.k==='venc')out.push({n:0,lv:'red',ic:'🔴',t:`O pagamento de <b>${esc(n)}</b> no valor de <b>${v}</b> está atrasado há ${st.dias} dia${st.dias>1?'s':''}.`,sub:`Venda #${s.numero} de ${fd(s.data)} · previsto para ${fd(s.prevista)}`,act:['pagar',s.id,'Registrar pagamento']});
    else if(st.k==='hoje')out.push({n:1,lv:'orange',ic:'🟠',t:`O pagamento de <b>${esc(n)}</b> no valor de <b>${v}</b> vence hoje.`,sub:`Venda #${s.numero} de ${fd(s.data)}`,act:['pagar',s.id,'Registrar pagamento']});
    else if(st.k==='prox')out.push({n:2,lv:'yellow',ic:'🟡',t:`O pagamento de <b>${esc(n)}</b> no valor de <b>${v}</b> vence em ${st.dias} dia${st.dias>1?'s':''} (${fd(s.prevista)}).`,sub:`Venda #${s.numero}`,act:['pagar',s.id,'Registrar pagamento']});
  });
  const dueToday=sales().filter(s=>s.prevista===t);
  if(dueToday.length&&dueToday.every(s=>openOf(s)<=0))out.push({n:3,lv:'green',ic:'🟢',t:'Todos os pagamentos previstos para hoje foram recebidos.'});
  else if(!opens.some(s=>['venc','hoje'].includes(stat(s).k)))out.push({n:3,lv:'green',ic:'🟢',t:'Nenhum pagamento atrasado ou vencendo hoje.'});
  prods().forEach(p=>{const st=stockStatus(p),a=stock(p.id);
    if(st.k==='esg')out.push({n:0,lv:'red',ic:'🔴',t:`O produto <b>${esc(pName(p))}</b> está sem estoque.`,act:['entrada',p.id,'Registrar entrada']});
    else if(st.k==='crit'||st.k==='baixo')out.push({n:st.k==='crit'?1:2,lv:st.k==='crit'?'orange':'yellow',ic:st.k==='crit'?'🟠':'🟡',t:`O produto <b>${esc(pName(p))}</b> está com apenas ${num(a)} unidade${a>1?'s':''} em estoque (mínimo: ${num(p.estoqueMinimo)}).`,act:['entrada',p.id,'Registrar entrada']});
    const mg=margemP(p);
    if(+p.preco>0&&+p.preco<=+p.custo)out.push({n:0,lv:'red',ic:'🔴',t:`O produto <b>${esc(pName(p))}</b> está sendo vendido pelo preço de custo ou abaixo (custo ${brl(p.custo)}, preço ${brl(p.preco)}).`,act:['editProd',p.id,'Ajustar preço']});
    else if(+p.preco>0&&mg<c.margemMin)out.push({n:2,lv:'yellow',ic:'🟡',t:`A margem de lucro de <b>${esc(pName(p))}</b> está baixa: ${pct(mg)} (meta mínima ${c.margemMin}%).`,act:['editProd',p.id,'Ajustar preço']});
  });
  all('despesas').forEach(d=>{const st=despStatus(d);
    if(st.k==='venc')out.push({n:0,lv:'red',ic:'🔴',t:`A despesa <b>${esc(d.categoria)}${d.descricao?' – '+esc(d.descricao):''}</b> de ${brl(d.valor)} venceu em ${fd(d.vencimento)} e não foi paga.`,act:['pagarDesp',d.id,'Marcar como paga']});
    else if(st.k==='hoje')out.push({n:1,lv:'orange',ic:'🟠',t:`A despesa <b>${esc(d.categoria)}${d.descricao?' – '+esc(d.descricao):''}</b> de ${brl(d.valor)} vence hoje.`,act:['pagarDesp',d.id,'Marcar como paga']});
  });
  // faturamento: compare month-to-date with same days of previous month
  const m=curM(),pm=prevM(m),day=t.slice(8,10);
  const pmEnd=pm+'-'+(day>lastDay(pm).slice(8,10)?lastDay(pm).slice(8,10):day);
  const now=sum(sales().filter(s=>s.data>=m+'-01'&&s.data<=t),s=>s.total),before=sum(sales().filter(s=>s.data>=pm+'-01'&&s.data<=pmEnd),s=>s.total);
  if(before>0&&now<before*(1-c.quedaFat/100))out.push({n:1,lv:'orange',ic:'🟠',t:`O faturamento caiu ${pct((1-now/before)*100)} em relação ao mesmo período do mês passado (${brl(now)} agora, ${brl(before)} antes).`});
  const lvl={red:0,orange:1,yellow:2,green:3};
  return out.sort((a,b)=>lvl[a.lv]-lvl[b.lv]||a.n-b.n);
}

// ---------- operations ----------
function nextSaleNo(){return salesAll().reduce((m,s)=>Math.max(m,+s.numero||0),0)+1}
function addMov(o){const before=stock(o.produtoId);putEntry('movimentos',Object.assign({id:uid(),ts:Date.now(),saldoAnterior:before,saldoPosterior:before+o.qtd},o))}
function opCompra(c){
  const p=prod(c.produtoId);const before=stock(p.id);const id=c.id||uid();
  putEntry('compras',Object.assign({id,ts:Date.now(),total:r2(c.qtd*c.valorUnit)},c,{id}));
  const newCost=before>0?(before*(+p.custo||0)+c.qtd*c.valorUnit)/(before+c.qtd):c.valorUnit;
  addMov({data:c.data,produtoId:p.id,tipo:'Compra',qtd:c.qtd,motivo:'Compra'+(c.fornecedor?' – '+c.fornecedor:''),ref:id,exemplo:c.exemplo||undefined});
  const np=Object.assign({},M.produtos.get(p.id),{custo:Math.round(newCost*100)/100});if(!np.fornecedor&&c.fornecedor)np.fornecedor=c.fornecedor;
  putMaster('produtos',p.id,np);
}
function opVenda(v){
  const id=v.id||uid();const numero=nextSaleNo();
  const itens=v.itens.map(i=>({produtoId:i.produtoId,qtd:i.qtd,preco:i.preco,custo:+prod(i.produtoId).custo||0}));
  const bruto=sum(itens,i=>i.qtd*i.preco);const total=r2(bruto-(+v.desconto||0));const custoTotal=r2(sum(itens,i=>i.qtd*i.custo));
  const s=Object.assign({},v,{id,numero,ts:Date.now(),itens,total,custoTotal});
  putEntry('vendas',s);
  itens.forEach(i=>addMov({data:v.data,produtoId:i.produtoId,tipo:'Venda',qtd:-i.qtd,motivo:'Venda #'+numero+' – '+cName(s),ref:id,exemplo:v.exemplo||undefined}));
  return s;
}
function opPagamento(saleId,valor,data,forma){const s=JSON.parse(JSON.stringify(getEntry('vendas',saleId)));s.pagamentos=(s.pagamentos||[]).concat([{data,valor:r2(valor),forma}]);putEntry('vendas',s)}

function monthsOpts(){const out=[];let m=nextM(curM());const all0=new Set();
  for(let i=0;i<25;i++){out.push(m);m=prevM(m)}
  COLS_B.forEach(c=>B[c].forEach((_,k)=>{if(!out.includes(k))out.push(k)}));
  return out.sort().reverse().map(x=>[x,MES[+x.slice(5,7)-1][0].toUpperCase()+MES[+x.slice(5,7)-1].slice(1)+' '+x.slice(0,4)])}
function yearsOpts(){const s=new Set([today().slice(0,4)]);COLS_B.forEach(c=>B[c].forEach((_,k)=>s.add(k.slice(0,4))));return [...s].sort().reverse()}

// ---------- rendering ----------
function chip(s){return `<span class="chip ${s.cls}">${esc(s.label)}</span>`}
function delta(cur,prev,good){ // good: 1 more is better, -1 less is better
  if(!prev&&!cur)return '<span class="flat">sem variação</span>';
  if(!prev)return '<span class="flat">sem dados no mês anterior</span>';
  const d=(cur-prev)/Math.abs(prev)*100;if(Math.abs(d)<0.5)return '<span class="flat">= mês anterior</span>';
  const better=(d>0)===(good>0);return `<span class="${better?'up':'down'}">${d>0?'▲':'▼'} ${pct(Math.abs(d))}</span> <span class="flat">vs mês anterior</span>`}
function kpi(l,v,s,cls){return `<div class="kpi ${cls||''}"><span class="l">${l}</span><span class="v">${v}</span>${s?`<span class="s">${s}</span>`:''}</div>`}
function table(head,rows,emptyMsg){

function exampleBanner(){
  const hasEx=all('produtos').some(p=>p.exemplo);const empty=!all('produtos').length&&!all('clientes').length;
  if(empty)return `<div class="banner"><p><b>Bem-vinda!</b> Comece cadastrando seus produtos e clientes. Depois é só registrar vendas, entradas e pagamentos: os cálculos são automáticos. Se quiser ver o sistema funcionando antes, carregue dados de exemplo e apague quando terminar.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="novoProd">Cadastrar produto</button><button class="btn" data-act="loadEx">Carregar exemplo</button></div></div>`;
  if(hasEx)return `<div class="banner"><p><b>Você está vendo dados de exemplo.</b> Os produtos, clientes e vendas marcados como exemplo são fictícios. Apague-os antes de começar a usar de verdade.</p><button class="btn" data-act="clearEx">Apagar dados de exemplo</button></div>`;
  return '';
}

const R={};
R.painel=()=>{

  const invT=r2(sum(all('investimentos'),i=>i.valor));

  const al=alerts().filter(x=>x.lv!=='green');

    ${kpi('💵 Valor recebido',brl(a.recebido),delta(a.recebido,b.recebido,1))}
    ${kpi('🧾 Valor a receber',brl(aberto),'Das vendas deste mês: '+brl(a.pend))}
    ${kpi('🔴 Valores vencidos',brl(vencV),venc.length?venc.length+' venda'+(venc.length>1?'s':'')+' em atraso':'Nenhum atraso',vencV>0?'bad':'')}
    ${kpi('📦 Valor atual do estoque',brl(estC),'A preço de custo · vale '+brl(estV)+' se vendido')}
    ${kpi('🛒 Quantidade de vendas',num(a.n),delta(a.n,b.n,1))}
    ${kpi('👥 Número de clientes',num(all('clientes').length),cliMes+' compraram neste mês')}
    ${kpi('📈 Lucro bruto',brl(a.lb),delta(a.lb,b.lb,1))}
    ${kpi('💰 Lucro líquido',brl(a.ll),delta(a.ll,b.ll,1),a.ll<0?'bad':'')}
    ${kpi('💸 Total de despesas',brl(a.desp),delta(a.desp,b.desp,-1))}
    ${kpi('🏗️ Total investido',brl(invT),'Neste mês: '+brl(a.inv))}
    ${kpi('📊 Margem de lucro',pct(a.margem),'Margem bruta · líquida '+pct(a.margemL))}
  </div>
  <div class="sec cols2">
    <div class="panel"><h2>Comparação com ${mLabel(prevM(m))}</h2>
      <div class="tw" style="border:0"><table><thead><tr><th>Indicador</th><th class="n">Mês anterior</th><th class="n">Este mês</th><th class="n">Variação</th></tr></thead><tbody>

function monthsWithData(){const s=new Set();['vendas','despesas','movimentos'].forEach(c=>B[c].forEach((_,k)=>s.add(k)));return [...s]}

R.vendas=()=>{
  const f=F.vendas;let list=salesAll().filter(s=>dateOk(s.data,f));
  if(f.cliente)list=list.filter(s=>s.clienteId===f.cliente);
  if(f.produto)list=list.filter(s=>s.itens.some(i=>i.produtoId===f.produto));
  if(f.categoria)list=list.filter(s=>s.itens.some(i=>prod(i.produtoId)?.categoria===f.categoria));
  if(f.forma)list=list.filter(s=>s.forma===f.forma);
  if(f.status)list=list.filter(s=>{const k=stat(s).k;return f.status==='aberto'?isOpenKind(k):k===f.status});
  if(f.q){const q=low(f.q);list=list.filter(s=>low(cName(s)+' '+s.numero+' '+(s.obs||'')).includes(q))}
  list.sort((a,b)=>b.data.localeCompare(a.data)||b.numero-a.numero);

    <td class="n">${num(sum(s.itens,i=>i.qtd))}</td><td class="n">${brl(sum(s.itens,i=>i.preco*i.qtd)/Math.max(1,sum(s.itens,i=>i.qtd)))}</td><td class="n">${s.desconto?brl(s.desconto):'—'}</td><td class="n"><b>${brl(s.total)}</b></td><td class="n">${brl(s.custoTotal)}</td><td class="n">${brl(s.total-s.custoTotal)}</td>
    <td class="nw">${esc(s.forma)}</td><td>${chip(st)}${openOf(s)>0&&paidOf(s)>0?`<br><span class="sub">falta ${brl(openOf(s))}</span>`:''}</td><td class="nw">${fd(s.prevista)}</td><td class="nw">${openOf(s)<=0&&!s.cancelada?fd(lastPayDate(s)):'—'}</td>

  ${fSel('vendas','status','Status',[['pago','Pago'],['aberto','Em aberto (todos)'],['pend','Pendente'],['venc','Vencido'],['hoje','Vence hoje'],['atrasopago','Pago com atraso'],['canc','Cancelada']])}${clr('vendas')}</div>
  <div class="sumrow"><span>Vendas: <b>${ok.length}</b></span><span>Total vendido: <b>${brl(sum(ok,s=>s.total))}</b></span><span>Custo: <b>${brl(sum(ok,s=>s.custoTotal))}</b></span><span>Lucro bruto: <b>${brl(sum(ok,s=>s.total-s.custoTotal))}</b></span><span>Pagas na hora: <b>${ok.filter(s=>(s.pagamentos||[]).some(p=>p.data<=s.data)&&openOf(s)<=0).length}</b></span><span>A receber: <b>${brl(sum(ok,openOf))}</b></span></div>

R.receber=()=>{
  const f=F.receber,t=today();
  const allOpen=sales().filter(s=>openOf(s)>0);
  const totalAberto=sum(allOpen,openOf),atraso=sum(allOpen.filter(s=>stat(s).k==='venc'),openOf),aVencer=totalAberto-atraso;
  const mR=f.mes||curM();const receb=fin(mR).recebido;
  let list=salesAll().filter(s=>!s.cancelada&&(s.prevista||(s.pagamentos||[]).some(p=>p.data>s.data)||openOf(s)>0));
  if(f.cliente)list=list.filter(s=>s.clienteId===f.cliente);
  if(f.mes)list=list.filter(s=>s.data.startsWith(f.mes));
  const sf=f.status||'aberto';
  list=list.filter(s=>{const k=stat(s).k;return sf==='todos'?true:sf==='aberto'?isOpenKind(k):k===sf});
  list.sort((a,b)=>(a.prevista||'9').localeCompare(b.prevista||'9'));
  const cs=cliStats();const dev=Object.entries(cs).filter(([,x])=>x.pend>0.005).sort((a,b)=>b[1].atraso-a[1].atraso||b[1].pend-a[1].pend);
  const avulso=allOpen.filter(s=>!s.clienteId);
  const rows=list.map(s=>{const st=stat(s);const c=cli(s.clienteId);return `<tr class="${st.k==='venc'?'late':st.k==='hoje'?'today':''}"><td>${esc(cName(s))}</td><td class="nw">${esc(c?.telefone||'—')}</td><td class="nw">#${s.numero}</td><td class="nw">${fd(s.data)}</td><td class="n">${brl(s.total)}</td><td class="n">${brl(paidOf(s))}</td><td class="n"><b>${brl(openOf(s))}</b></td><td class="nw">${fd(s.prevista)}</td><td class="n">${st.k==='venc'?st.dias:'—'}</td><td>${chip(st)}</td><td>${esc(s.obs||'')}</td><td>${openOf(s)>0?`<button class="btn sm pri" data-act="pagar" data-id="${s.id}">💰 Receber</button>`:''}</td></tr>`});
  return `<div class="hd"><div><h1>Contas a receber</h1><p>Vendas fiado ou com pagamento combinado para depois. O dinheiro só entra no caixa quando você registra o pagamento.</p></div></div>${quick()}
  <div class="kpis">${kpi('🧾 Total a receber',brl(totalAberto),allOpen.length+' venda'+(allOpen.length!==1?'s':'')+' em aberto')}${kpi('🔴 Total em atraso',brl(atraso),'',atraso>0?'bad':'')}${kpi('🟡 Total a vencer',brl(aVencer))}${kpi('🟢 Total recebido',brl(receb),'Em '+mLabel(mR))}</div>
  <div class="sec"><h2>Quem está devendo</h2>
  ${table(['Cliente','Telefone',['Em aberto','n'],['Em atraso','n'],['Maior atraso','n'],'Próximo vencimento',''],dev.map(([id,x])=>{const c=cli(id);return `<tr class="${x.atraso>0?'late':''}"><td><b>${esc(c?.nome)}</b></td><td class="nw">${esc(c?.telefone||'—')}</td><td class="n"><b>${brl(x.pend)}</b></td><td class="n">${x.atraso>0?brl(x.atraso):'—'}</td><td class="n">${x.maxDias?x.maxDias+' dias':'—'}</td><td class="nw">${fd(x.prox)}</td><td class="nw"><button class="btn sm pri" data-act="pagarCli" data-id="${id}">💰 Receber</button> <button class="btn sm" data-act="hist" data-id="${id}">Histórico</button></td></tr>`}).concat(avulso.length?[`<tr><td><i>Vendas avulsas</i></td><td>—</td><td class="n">${brl(sum(avulso,openOf))}</td><td colspan="4"></td></tr>`]:[]),'Ninguém está devendo. 🎉')}</div>
  <div class="sec"><h2>Vendas a prazo</h2>
  <div class="filters">${fCli('receber')}${fSel('receber','status','Status',[['aberto','Em aberto (todos)'],['venc','Vencido'],['hoje','Vence hoje'],['prox','Próximo do vencimento'],['pend','Pendente'],['pago','Pago'],['atrasopago','Pago com atraso'],['todos','Todos']],null)}${fMes('receber','Mês da venda')}${clr('receber')}</div>
  ${table(['Cliente','Telefone','Venda','Data da venda',['Valor','n'],['Já pago','n'],['Devendo','n'],'Previsto',['Dias em atraso','n'],'Status','Observação',''],rows)}</div>`;
};

R.produtos=()=>{
  const f=F.produtos,si=stockInfo();let list=prods();
  if(f.q){const q=low(f.q);list=list.filter(p=>low(p.codigo+' '+p.nome+' '+p.marca+' '+p.fornecedor).includes(q))}
  if(f.categoria)list=list.filter(p=>p.categoria===f.categoria);

function periodRange(){const f=F.caixa,r=f.ref||today();
  if(f.tipo==='dia')return[r,r,fd(r)];
  if(f.tipo==='semana'){const d=new Date(r+'T12:00:00');const wd=(d.getDay()+6)%7;const a=addDays(r,-wd),b=addDays(a,6);return[a,b,'Semana de '+fd(a)+' a '+fd(b)]}
  if(f.tipo==='ano'){const y=r.slice(0,4);return[y+'-01-01',y+'-12-31','Ano de '+y]}
  const m=r.slice(0,7);return[m+'-01',lastDay(m),mLabel(m)]}

R.analise=()=>{
  const f=F.analise;const t=today();let a=null,b=null,lbl='todo o período';
  if(f.per==='mes'){const m=f.mes||curM();a=m+'-01';b=lastDay(m);lbl=mLabel(m)}else if(f.per==='30'){a=addDays(t,-29);b=t;lbl='últimos 30 dias'}else if(f.per==='90'){a=addDays(t,-89);b=t;lbl='últimos 90 dias'}
  const st=prodStats(a,b),c=cfg();const s30=prodStats(addDays(t,-29),t);
  let rows=prods().map(p=>Object.assign({p},st[p.id]));
  if(f.categoria)rows=rows.filter(r=>r.p.categoria===f.categoria);
  const maxQ=Math.max(0,...rows.map(r=>r.q)),maxL=Math.max(0,...rows.map(r=>r.lucro));

  const rep=reposicao();const repMap={};rep.forEach(r=>repMap[r.p.id]=r);
  const tr=rows.map(r=>{const tags=[];if(r.q>0&&r.q===maxQ)tags.push('Mais vendido');if(r.lucro>0&&r.lucro===maxL)tags.push('Mais lucro');
    const mg=r.margem??margemP(r.p);if(mg<c.margemMin)tags.push('Margem baixa');if(!(s30[r.p.id]?.q)&&stock(r.p.id)>0)tags.push('Parado 30 dias');if(stock(r.p.id)<=(+r.p.estoqueMinimo||0))tags.push('Repor');
    return `<tr><td><b>${esc(pName(r.p))}</b><br><span class="sub">${esc(r.p.categoria)}</span></td><td class="n">${num(r.q)}</td><td class="n">${brl(r.fat)}</td><td class="n">${brl(r.custo)}</td><td class="n"><b>${brl(r.lucro)}</b></td><td class="n">${r.margem===null?'—':pct(r.margem)}</td><td>${tags.map(x=>`<span class="tag">${x}</span>`).join('')}</td></tr>`});
  const sh=(k,l)=>`<th class="sort ${k==='nome'?'':'n'}" data-act="sortA" data-id="${k}">${l}${key===k?' ▾':''}</th>`;
  const rr=rep.slice().sort((x,y)=>y.sug-x.sug).map(r=>`<tr class="${r.at<=0?'late':r.at<=r.mn?'today':''}"><td>${esc(pName(r.p))}</td><td class="n"><b>${num(r.at)}</b></td><td class="n">${num(r.mn)}</td><td class="n">${num(r.v30)}</td><td class="n">${num(Math.round(r.med*10)/10)}</td><td class="nw">${r.cob===null?'Sem vendas recentes':r.cob===0?'<b style="color:var(--bad)">Acabou</b>':'~'+r.cob+' dias ('+fdShort(r.fim)+')'}</td><td class="n"><b>${r.sug?num(r.sug)+' un.':'—'}</b></td><td class="n">${r.sug?brl(r.custoSug):'—'}</td><td>${r.sug?`<button class="btn sm pri" data-act="entrada" data-id="${r.p.id}">Comprar</button>`:''}</td></tr>`);
  return `<div class="hd"><div><h1>Produtos e reposição</h1><p>Quais produtos vendem mais, dão mais lucro, têm margem baixa, estão parados ou precisam ser repostos.</p></div></div>${quick()}
  <div class="filters">${fSel('analise','per','Período',[['mes','Um mês'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['tudo','Todo o período']],null)}${f.per==='mes'?fSel('analise','mes','Mês',monthsOpts(),null):''}${fSel('analise','categoria','Categoria',CAT_PROD,'Todas')}</div>
  <h2>Desempenho · ${lbl}</h2>
  <div class="tw"><table><thead><tr>${sh('nome','Produto')}${sh('q','Qtd vendida')}${sh('fat','Faturamento')}${sh('custo','Custo')}${sh('lucro','Lucro')}${sh('margem','Margem %')}<th>Destaques</th></tr></thead><tbody>${tr.join('')||'<tr><td colspan="7" class="empty">Nenhum produto.</td></tr>'}</tbody></table></div>
  <div class="sec"><h2>Quando comprar de novo</h2>
  ${table(['Produto',['Estoque atual','n'],['Mínimo','n'],['Vendido (30 dias)','n'],['Média mensal','n'],'Previsão de acabar',['Sugestão de compra','n'],['Custo estimado','n'],''],rr,'Nenhum produto.')}
  <p class="note"><b>Como a sugestão é calculada:</b> média mensal de vendas dos últimos 90 dias + estoque mínimo − estoque atual. A previsão divide o estoque atual pela média de vendas por dia. Total estimado para repor tudo: <b>${brl(sum(rep,r=>r.custoSug))}</b>.</p></div>`;
};

function gsPanel(){
  if(gs){const q=gsQueue.length;return `<div class="panel" style="margin-bottom:16px"><h2>🟢 Google Planilhas conectado</h2>
    <p class="sub" style="margin-top:0">Tudo o que você registra no app é gravado na sua planilha, uma aba para cada assunto (Produtos, Vendas, Pagamentos, Clientes…). Alterações feitas na planilha aparecem no app ao sincronizar.</p>
    <ul class="list"><li><span>Situação</span><b>${gsState.erro?'⚠ '+esc(gsState.erro):q?q+' alteração(ões) esperando envio':'Tudo enviado'}</b></li><li><span>Última sincronização</span><b>${gsState.last?gsState.last.toLocaleString('pt-BR'):'—'}</b></li></ul>
    <div class="mf" style="justify-content:flex-start"><button class="btn pri" data-act="gsSync">Sincronizar agora</button>${gs.planilha?`<a class="btn" href="${esc(gs.planilha)}" target="_blank" rel="noopener">Abrir a planilha ↗</a>`:''}<button class="btn" data-act="gsUpload">Reenviar tudo para a planilha</button><button class="btn danger" data-act="gsOff">Desconectar</button></div></div>`}
  return `<div class="panel" style="margin-bottom:16px"><h2>Conectar ao Google Planilhas</h2>
    <p class="sub" style="margin-top:0">Guarde todos os dados numa planilha sua, para consultar, conferir e usar em vários aparelhos. Siga o passo a passo do arquivo <b>LEIA-ME</b> (README) para criar a planilha e copiar o endereço e a chave.</p>
    <div class="grid"><label class="fld wide">Endereço do app da planilha<input id="gs-url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(localStorage.getItem(LSK+'gsurl')||'')}"></label>
    <label class="fld">Chave de acesso<input id="gs-chave" type="password" autocomplete="off"><small>A mesma que você escreveu no código da planilha.</small></label></div>
    <div class="mf" style="justify-content:flex-start"><button class="btn pri" id="gs-go" data-act="gsConnect">Conectar</button><span class="sub" id="gs-msg"></span></div></div>`;
}
async function gsConnect(){
  const url=val('gs-url'),chave=val('gs-chave'),msg=$('#gs-msg'),btn=$('#gs-go');
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){msg.textContent='Cole o endereço que termina em /exec, copiado da implantação do Apps Script.';return}
  if(!chave){msg.textContent='Digite a chave de acesso.';return}
  try{localStorage.setItem(LSK+'gsurl',url)}catch(e){}
  btn.disabled=true;msg.textContent='Conectando…';
  const prev=gs;gs={url,chave};
  try{
    await gsPost({ops:[]}); // cria as abas e confere a chave
    const d=await gsGet();const temPlan=sheetHasData(d);const temLocal=all('produtos').length||all('clientes').length||salesAll().length;
    const finish=async(how)=>{
      gsQueue=[];touched.clear();
      if(how==='enviar'){gsQueue=fullOps();saveQueue();saveGs();closeModal();render();await gsSend();gsState.last=new Date();render();toast(gsState.erro?gsState.erro:'Planilha conectada e dados enviados.')}
      else{applySheets(fromSheets(d));saveQueue();saveGs();gsState.last=new Date();gsState.erro='';closeModal();render();toast('Planilha conectada.')}
    };
    if(temPlan&&temLocal){
      openModal('A planilha já tem dados',`<p style="margin-top:0">Este aparelho também tem lançamentos. Qual versão você quer manter?</p>
      <div class="mf" style="justify-content:flex-start"><button class="btn pri" id="gs-a">Usar os dados da planilha</button><button class="btn" id="gs-b">Enviar os deste aparelho (substitui a planilha)</button><button class="btn" data-act="closeModal">Cancelar</button></div>`,true);
      $('#gs-a').onclick=()=>finish('carregar');$('#gs-b').onclick=()=>finish('enviar');
      const chk=setInterval(()=>{if(!$('#ov')){clearInterval(chk);if(!localStorage.getItem(GS_KEY)){gs=prev;render()}}},300);
    }else await finish(temLocal?'enviar':'carregar');
  }catch(e){gs=prev;btn.disabled=false;const m=String(e&&e.message||'');msg.textContent=/failed to fetch|load failed|networkerror|fetch/i.test(m)?'A planilha não liberou o acesso. No Apps Script, vá em Implantar → Gerenciar implantações → ✏️ Editar e deixe "Quem pode acessar" como "Qualquer pessoa" (não "com Conta do Google"). Escolha Versão: Nova versão e clique em Implantar.':(m||'Não foi possível conectar. Confira o endereço, a chave e a internet.')}
}

function renderNav(){
  const al=alerts().filter(x=>x.lv==='red'||x.lv==='orange').length;
  let h='',open=false;
  VIEWS.forEach(([k,l])=>{if(k==='g'){if(open)h+='</div>';h+=`<div class="navg"><span>${l}</span>`;open=true}else h+=`<button class="nav${view===k?' on':''}" data-act="go" data-id="${k}"><span>${l}</span>${k==='alertas'&&al?`<span class="bdg">${al}</span>`:''}</button>`});
  if(open)h+='</div>';$('#nav').innerHTML=h;$('#storeName').textContent=cfg().nome;
}
function render(){
  if(!loaded&&mode!=='local'){$('#main').innerHTML='<div class="empty">Carregando seus dados…</div>';renderNav();setSaveState();return}
  const ae=document.activeElement;const fid=ae&&ae.id&&$('#main').contains(ae)?ae.id:null;let sel=null;try{sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  try{$('#main').innerHTML=R[view]()}catch(e){console.error(e);$('#main').innerHTML='<div class="empty">Algo deu errado ao montar esta tela. Tente outra área.</div>'}
  renderNav();setSaveState();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel&&sel[0]!=null)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

function closeModal(){$('#modalRoot').innerHTML='';modalClose=null;if(gs&&gsState.aguardando){gsState.aguardando=false;setTimeout(()=>gsSync(true),50)}}
function confirmBox(title,msg,yesLabel,onYes,danger){
  openModal(title,`<p style="margin:0 0 6px;max-width:60ch">${msg}</p><div class="mf"><button class="btn" data-act="closeModal">Voltar</button><button class="btn ${danger?'danger':'pri'}" id="cfYes">${esc(yesLabel)}</button></div>`,true);
  $('#cfYes').onclick=async()=>{$('#cfYes').disabled=true;await onYes();};
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
const nval=id=>{const v=parseFloat(val(id).replace(',','.'));return isFinite(v)?v:0};
const opt=(list,sel,blank)=>(blank!==undefined?`<option value="">${blank}</option>`:'')+list.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`}).join('');
const fld=(label,inner,cls,hint)=>`<label class="fld ${cls||''}">${label}${inner}${hint?`<small>${hint}</small>`:''}</label>`;
function setMsg(t,warn){const m=$('#mMsg');if(m){m.textContent=t;m.className='msg'+(warn?' warn':'')}}
const recent=ts=>ts&&Date.now()-ts<10*60*1000;
async function save(okMsg){const ok=await flush();closeModal();render();if(ok&&okMsg)toast(okMsg)}

// --- Nova venda
function mVenda(){
  if(!prods().length){toast('Cadastre um produto antes de registrar vendas.');return mProduto()}
  let items=[{produtoId:'',qtd:1,preco:0}];let recTouched=false;let dupOk=false;
  const pOpts=sel=>`<option value="">Escolha o produto…</option>`+prods().map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(pName(p))} · ${brl(p.preco)} · estoque ${num(stock(p.id))}</option>`).join('');
  openModal('➕ Nova venda',`<div class="grid">
    ${fld('Data',`<input type="date" id="v-data" value="${today()}">`)}
    ${fld('Cliente',`<select id="v-cli"><option value="">Venda avulsa (sem cadastro)</option><option value="__novo">+ Cadastrar cliente novo…</option>${clis().map(c=>`<option value="${c.id}">${esc(c.nome)}${cliStats()[c.id]?.pend>0.005?' · devendo '+brl(cliStats()[c.id].pend):''}</option>`).join('')}</select>`)}
    <div class="fld" id="v-novo" hidden style="grid-column:1/-1"><div class="grid">${fld('Nome do cliente novo',`<input id="v-nnome">`)}${fld('Telefone',`<input id="v-ntel" inputmode="tel">`)}${fld('Bairro/região',`<input id="v-nbairro">`)}</div></div>
  </div>
  <h3 style="margin-top:16px">Produtos</h3><div class="items" id="v-items"></div>
  <p style="margin:8px 0 0"><button class="btn" id="v-add">+ Adicionar outro produto</button></p>
  <div class="grid" style="margin-top:14px">
    ${fld('Desconto (R$)',`<input type="number" id="v-desc" min="0" step="0.01" value="0">`)}
    ${fld('Forma de pagamento',`<select id="v-forma">${opt(FORMAS,'Pix')}</select>`)}
    ${fld('Recebido agora (R$)',`<input type="number" id="v-rec" min="0" step="0.01" value="0">`,'','Se for menos que o total, o restante vai para Contas a receber.')}
    ${fld('Data prevista para pagamento',`<input type="date" id="v-prev" value="${addDays(today(),7)}">`,'','Usada quando falta receber algo.')}
    ${fld('Observações',`<input id="v-obs">`,'wide')}
  </div>
  <div class="summ" id="v-sum"></div>
  <div class="mf"><span class="msg" id="mMsg"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" id="v-save">Salvar venda</button></div>`);
  const calc=()=>{const bruto=sum(items,i=>i.qtd*i.preco);const desc=nval('v-desc');const total=r2(bruto-desc);const custo=sum(items,i=>{const p=prod(i.produtoId);return p?i.qtd*(+p.custo||0):0});return{bruto,desc,total,custo,lucro:total-custo}};
  const upd=()=>{const c=calc();if(!recTouched)$('#v-rec').value=val('v-forma')==='Fiado'?0:Math.max(0,c.total).toFixed(2);
    const rec=nval('v-rec');const falta=r2(c.total-rec);$('#v-prev').closest('.fld').style.opacity=falta>0?1:.5;
    $('#v-sum').innerHTML=`<span>Subtotal <b>${brl(c.bruto)}</b></span><span>Desconto <b>${brl(c.desc)}</b></span><span>Total <b>${brl(c.total)}</b></span><span>Custo <b>${brl(c.custo)}</b></span><span>Lucro bruto <b style="color:var(--${c.lucro<0?'bad':'ok'})">${brl(c.lucro)}</b></span>${falta>0?`<span>Fica a receber <b style="color:var(--warn)">${brl(falta)}</b></span>`:''}`;
    items.forEach((it,i)=>{const el=document.getElementById('v-st'+i);if(el)el.textContent=brl(it.qtd*it.preco)});dupOk=false;setMsg('')};
  const drawItems=()=>{$('#v-items').innerHTML=items.map((it,i)=>`<div class="item"><select id="v-p${i}" data-i="${i}" aria-label="Produto">${pOpts(it.produtoId)}</select><input type="number" id="v-q${i}" data-i="${i}" min="1" step="1" value="${it.qtd}" aria-label="Quantidade"><input type="number" id="v-pr${i}" data-i="${i}" min="0" step="0.01" value="${it.preco||''}" placeholder="Preço" aria-label="Preço unitário"><span class="st" id="v-st${i}"></span><button class="x" data-rm="${i}" aria-label="Remover" ${items.length<2?'disabled':''}>×</button></div>`).join('');
    items.forEach((it,i)=>{
      $('#v-p'+i).onchange=e=>{it.produtoId=e.target.value;const p=prod(it.produtoId);it.preco=p?+p.preco:0;$('#v-pr'+i).value=it.preco||'';upd()};
      $('#v-q'+i).oninput=e=>{it.qtd=Math.max(0,parseFloat(e.target.value)||0);upd()};
      $('#v-pr'+i).oninput=e=>{it.preco=Math.max(0,parseFloat(e.target.value)||0);upd()};});
    $('#v-items').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.rm,1);drawItems();upd()});upd()};
  drawItems();
  $('#v-add').onclick=()=>{items.push({produtoId:'',qtd:1,preco:0});drawItems();$('#v-p'+(items.length-1)).focus()};
  $('#v-cli').onchange=()=>{$('#v-novo').hidden=val('v-cli')!=='__novo';if(val('v-cli')==='__novo')$('#v-nnome').focus()};
  $('#v-forma').onchange=()=>{recTouched=false;if(val('v-forma')==='Fiado'&&!$('#v-prev').value)$('#v-prev').value=addDays(today(),7);upd()};
  $('#v-desc').oninput=upd;$('#v-rec').oninput=()=>{recTouched=true;upd()};
  $('#v-save').onclick=async()=>{
    const it=items.filter(i=>i.produtoId&&i.qtd>0);if(!it.length)return setMsg('Escolha pelo menos um produto e a quantidade.');
    if(items.some(i=>i.produtoId&&!(i.qtd>0)))return setMsg('Confira as quantidades: todas precisam ser maiores que zero.');
    const need={};it.forEach(i=>need[i.produtoId]=(need[i.produtoId]||0)+i.qtd);
    for(const pid in need){if(need[pid]>stock(pid)){return setMsg(`Estoque insuficiente de ${pName(prod(pid))}: tem ${num(stock(pid))}, a venda pede ${num(need[pid])}. Registre uma entrada ou ajuste antes.`)}}
    const data=val('v-data');if(!data)return setMsg('Informe a data da venda.');
    const c=calc();if(c.total<0)return setMsg('O desconto não pode ser maior que o valor dos produtos.');
    let rec=Math.min(Math.max(0,nval('v-rec')),c.total);const falta=r2(c.total-rec);const prevista=falta>0?val('v-prev'):'';
    let cid=val('v-cli');const forma=val('v-forma');
    if(cid==='__novo'){const nome=val('v-nnome');if(!nome)return setMsg('Digite o nome do cliente novo.');const dup=clis().find(x=>low(x.nome)===low(nome)||(digits(val('v-ntel'))&&digits(x.telefone)===digits(val('v-ntel'))));if(dup)return setMsg(`Já existe um cliente parecido: ${dup.nome}. Escolha-o na lista.`)}
    if(falta>0&&!cid)return setMsg('Para vender fiado ou com pagamento depois, escolha ou cadastre o cliente.');
    if(falta>0&&!prevista)return setMsg('Informe a data prevista para o pagamento.');
    const sig=JSON.stringify(it.map(i=>[i.produtoId,i.qtd,i.preco]));
    const dup=salesAll().find(s=>!s.cancelada&&recent(s.ts)&&s.data===data&&(s.clienteId||'')===(cid==='__novo'?'x':cid)&&Math.abs(s.total-c.total)<0.01&&JSON.stringify(s.itens.map(i=>[i.produtoId,i.qtd,i.preco]))===sig);
    if(dup&&!dupOk){dupOk=true;$('#v-save').textContent='Salvar mesmo assim';return setMsg(`Parece repetida: a venda #${dup.numero} igual foi registrada há poucos minutos. Toque de novo para salvar mesmo assim.`,true)}
    $('#v-save').disabled=true;
    if(cid==='__novo'){cid=uid();putMaster('clientes',cid,{nome:val('v-nnome'),telefone:val('v-ntel'),bairro:val('v-nbairro'),obs:'',criadoEm:today()})}
    const s=opVenda({data,clienteId:cid||'',itens:it.map(i=>({...i})),desconto:nval('v-desc'),forma,prevista,obs:val('v-obs'),pagamentos:rec>0?[{data,valor:r2(rec),forma:forma==='Fiado'?'Dinheiro':forma}]:[]});
    await save(`Venda #${s.numero} registrada: ${brl(s.total)}${falta>0?' · '+brl(falta)+' a receber':''}`);
  };
}

// --- Pagamento
function mPagar(saleId,cliId){
  const openList=()=>sales().filter(s=>openOf(s)>0);
  if(!openList().length){toast('Não há vendas com valor em aberto.');return}
  let s=saleId?getEntry('vendas',saleId):null;
  const cliOpts=[...new Set(openList().filter(x=>x.clienteId).map(x=>x.clienteId))].map(id=>[id,cli(id)?.nome+' · '+brl(cliStats()[id].pend)]);
  openModal('💰 Registrar pagamento',`${s?`<p style="margin-top:0"><b>${esc(cName(s))}</b> · Venda #${s.numero} de ${fd(s.data)} · total ${brl(s.total)} · já pago ${brl(paidOf(s))} · <b>devendo ${brl(openOf(s))}</b></p>`:
    `<div class="grid">${fld('Cliente',`<select id="p-cli">${opt(cliOpts,cliId,'Escolha…')}</select>`)}</div><div id="p-list" class="sub" style="margin:8px 0"></div>`}
    <div class="grid">${fld('Valor recebido (R$)',`<input type="number" id="p-val" min="0" step="0.01" value="${s?openOf(s).toFixed(2):''}">`)}${fld('Data do pagamento',`<input type="date" id="p-data" value="${today()}">`)}${fld('Forma',`<select id="p-forma">${opt(FORMAS_PG,'Pix')}</select>`)}</div>
    ${s?'':'<p class="sub">O valor é abatido primeiro das vendas mais antigas desse cliente.</p>'}
    <div class="mf"><span class="msg" id="mMsg"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" id="p-save">Confirmar pagamento</button></div>`,true);
  const showList=()=>{const id=val('p-cli');if(!id){$('#p-list').innerHTML='';return}const l=openList().filter(x=>x.clienteId===id).sort((a,b)=>a.data.localeCompare(b.data));
    $('#p-list').innerHTML=l.map(x=>`Venda #${x.numero} (${fd(x.data)}) · devendo ${brl(openOf(x))} · ${stat(x).label}`).join('<br>');$('#p-val').value=sum(l,openOf).toFixed(2)};
  if(!s){$('#p-cli').onchange=showList;if(cliId)showList()}
  $('#p-save').onclick=async()=>{let v=r2(nval('p-val'));const d=val('p-data'),fm=val('p-forma');if(!(v>0))return setMsg('Informe o valor recebido.');if(!d)return setMsg('Informe a data.');
    let targets;if(s){if(v>openOf(s)+0.005)return setMsg('O valor é maior do que o cliente deve nesta venda ('+brl(openOf(s))+').');targets=[s]}
    else{const id=val('p-cli');if(!id)return setMsg('Escolha o cliente.');targets=openList().filter(x=>x.clienteId===id).sort((a,b)=>a.data.localeCompare(b.data));if(v>sum(targets,openOf)+0.005)return setMsg('O valor é maior do que o total devido ('+brl(sum(targets,openOf))+').')}
    $('#p-save').disabled=true;const tot=v;for(const t of targets){if(v<=0.005)break;const x=Math.min(v,openOf(t));opPagamento(t.id,x,d,fm);v=r2(v-x)}
    await save('Pagamento de '+brl(tot)+' registrado.')};
}

// --- Entrada de estoque
function mCompra(pid){
  if(!prods().length){toast('Cadastre o produto primeiro.');return mProduto()}
  let dupOk=false;const forn=[...new Set([...all('compras').map(c=>c.fornecedor),...prods().map(p=>p.fornecedor)].filter(Boolean))];
  openModal('📦 Entrada de estoque',`<div class="grid">
    ${fld('Data da compra',`<input type="date" id="c-data" value="${today()}">`)}
    ${fld('Fornecedor',`<input id="c-forn" list="c-fl"><datalist id="c-fl">${forn.map(f=>`<option value="${esc(f)}">`).join('')}</datalist>`)}
    ${fld('Produto',`<select id="c-prod">${opt(prods().map(p=>[p.id,pName(p)+' · estoque '+num(stock(p.id))]),pid,'Escolha…')}</select>`,'wide')}
    ${fld('Quantidade comprada',`<input type="number" id="c-qtd" min="1" step="1">`)}
    ${fld('Valor unitário (R$)',`<input type="number" id="c-vu" min="0" step="0.01">`)}
    ${fld('Valor total',`<input id="c-tot" readonly tabindex="-1">`)}
    ${fld('Forma de pagamento',`<select id="c-forma">${opt(FORMAS_PG,'Pix')}</select>`)}
    ${fld('Data de pagamento',`<input type="date" id="c-dpag" value="${today()}">`,'','Se for pagar depois, coloque a data combinada.')}
    ${fld('Observação',`<input id="c-obs">`,'wide')}</div>
    <div class="mf"><span class="msg" id="mMsg"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" id="c-save">Registrar entrada</button></div>`);
  const upd=()=>{$('#c-tot').value=brl(nval('c-qtd')*nval('c-vu'));dupOk=false;setMsg('')};
  const setP=()=>{const p=prod(val('c-prod'));if(p){$('#c-vu').value=(+p.custo||0).toFixed(2);if(!val('c-forn')&&p.fornecedor)$('#c-forn').value=p.fornecedor}upd()};
  $('#c-prod').onchange=setP;$('#c-qtd').oninput=upd;$('#c-vu').oninput=upd;if(pid){setP();setTimeout(()=>$('#c-qtd').focus(),40)}
  $('#c-save').onclick=async()=>{const p=val('c-prod'),q=nval('c-qtd'),vu=nval('c-vu'),d=val('c-data');
    if(!p)return setMsg('Escolha o produto.');if(!(q>0))return setMsg('Informe a quantidade.');if(!(vu>0))return setMsg('Informe o valor unitário.');if(!d)return setMsg('Informe a data.');
    const dup=all('compras').find(c=>!c.cancelada&&recent(c.ts)&&c.produtoId===p&&c.qtd===q&&c.valorUnit===vu&&c.data===d);
    if(dup&&!dupOk){dupOk=true;$('#c-save').textContent='Registrar mesmo assim';return setMsg('Uma entrada igual foi registrada há poucos minutos. Toque de novo para registrar mesmo assim.',true)}
    $('#c-save').disabled=true;opCompra({data:d,fornecedor:val('c-forn'),produtoId:p,qtd:q,valorUnit:vu,forma:val('c-forma'),dataPagamento:val('c-dpag')||d,obs:val('c-obs')});
    await save(`Entrada registrada: +${num(q)} ${pName(prod(p))}`)};
}

    ${fld('Nome do produto',`<input id="p-nome" value="${esc(p?.nome||'')}" placeholder="Ex.: Sabão em pó">`)}
    ${fld('Categoria',`<input id="p-cat" list="p-catl" value="${esc(p?.categoria||'')}"><datalist id="p-catl">${CAT_PROD.map(c=>`<option value="${c}">`).join('')}</datalist>`)}

    ${fld('Unidade de venda',`<select id="p-un">${opt(UNIDADES,p?.unidade||'Unidade')}</select>`)}
    ${fld('Estoque inicial',`<input type="number" id="p-ini" min="0" step="1" value="${esc(p?p.estoqueInicial:0)}" ${p?'readonly':''}>`,'',p?'Para corrigir, use Ajustar na lista de produtos.':'Quantidade que você já tem hoje.')}
    ${fld('Estoque mínimo',`<input type="number" id="p-min" min="0" step="1" value="${esc(p?p.estoqueMinimo:5)}">`,'','Abaixo disso aparece o alerta 🟡.')}
    ${fld('Custo de compra por unidade (R$)',`<input type="number" id="p-custo" min="0" step="0.01" value="${esc(p?p.custo:'')}">`,'',p?'Atualizado sozinho a cada entrada (custo médio).':'')}
    ${fld('Preço de venda por unidade (R$)',`<input type="number" id="p-preco" min="0" step="0.01" value="${esc(p?p.preco:'')}">`)}
    ${fld('Fornecedor',`<input id="p-forn" value="${esc(p?.fornecedor||'')}">`)}
  </div><div class="summ" id="p-mg"></div>
  <div class="mf"><span class="msg" id="mMsg"></span>${p?`<button class="btn danger" id="p-del">Excluir</button>`:''}<button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" id="p-save">Salvar produto</button></div>`);
  const upd=()=>{const c=nval('p-custo'),pr=nval('p-preco');$('#p-mg').innerHTML=`<span>Margem de lucro: <b>${brl(pr-c)}</b> por unidade</span><span><b>${pct(pr>0?(pr-c)/pr*100:0)}</b> do preço de venda</span>`};
  $('#p-custo').oninput=upd;$('#p-preco').oninput=upd;upd();
  if(p)$('#p-del').onclick=()=>{const used=salesAll().some(s=>s.itens.some(i=>i.produtoId===p.id))||all('movimentos').some(m=>m.produtoId===p.id);
    if(used)return setMsg('Este produto tem vendas ou movimentações no histórico e não pode ser excluído. Você pode zerar o estoque com um ajuste.');
    confirmBox('Excluir produto',`Excluir <b>${esc(pName(p))}</b>?`,'Excluir',async()=>{delMaster('produtos',p.id);await save('Produto excluído.')},true)};
  $('#p-save').onclick=async()=>{const cod=val('p-cod'),nome=val('p-nome');if(!cod||!nome)return setMsg('Preencha código e nome.');
    if(prods().some(x=>x.id!==id&&low(x.codigo)===low(cod)))return setMsg('Já existe um produto com o código '+cod+'.');
    const tam=val('p-tam');if(prods().some(x=>x.id!==id&&low(x.nome)===low(nome)&&low(x.tamanho)===low(tam)&&low(x.marca)===low(val('p-marca'))))return setMsg('Esse produto já está cadastrado.');
    const d=Object.assign({},p?M.produtos.get(id):{criadoEm:today()},{codigo:cod,nome,categoria:val('p-cat')||'Outros',marca:val('p-marca'),tamanho:tam,unidade:val('p-un'),estoqueInicial:p?p.estoqueInicial:Math.max(0,nval('p-ini')),estoqueMinimo:Math.max(0,nval('p-min')),custo:nval('p-custo'),preco:nval('p-preco'),fornecedor:val('p-forn')});
    $('#p-save').disabled=true;putMaster('produtos',id||uid(),d);await save(p?'Produto atualizado.':'Produto cadastrado.')};
}
